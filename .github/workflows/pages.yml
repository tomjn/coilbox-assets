name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # The promotion job pushes on a schedule and can push again before the last
  # deploy has finished. Queue the newer run rather than racing it, and let the
  # older one finish so the site is never left half published.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          # The whole repo, so the asset layout can change without touching this.
          path: .
          # Off by default, and with it off the action drops every dotfile at
          # the root, .nojekyll included. .git and .github stay excluded either
          # way.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
